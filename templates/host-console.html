{{define "host-console.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Console — Agentic Blind Date</title>
  {{template "fragment-theme-head.html" .}}
  {{template "fragment-theme-device-choice.html" .}}
  <script src="/static/htmx-1.9.12.min.js"></script>
</head>
<body class="bg-page text-ink min-h-screen px-6 py-10">
  <div class="max-w-sm mx-auto space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-display font-bold">Host console</h1>
      <p class="text-ink-muted text-sm mt-1">Agentic Blind Date</p>
    </div>

    {{template "fragment-host-console-state.html" .}}

    <div class="text-center">
      <a href="/admin" class="text-accent hover:opacity-80 text-sm">← Back to admin</a>
    </div>
  </div>
  <script>
    const _es = new EventSource('/admin/host/stream');
    _es.addEventListener('refresh', () => htmx.trigger('#host-console-state', 'refresh'));
    _es.onerror = () => _es.close();
  </script>
</body>
</html>
{{end}}
