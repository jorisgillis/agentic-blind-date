services:
  app:
    build: .
    container_name: agentic-blind-date
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080" # only Caddy (on this host) may reach the app, so its basic auth cannot be bypassed
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      - DB_PATH=/data/blind_date.db
