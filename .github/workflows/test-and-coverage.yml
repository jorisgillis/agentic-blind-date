name: Test and Coverage

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod download

    - name: Run tests with coverage
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -func=coverage.out

    - name: Check coverage (ADR-0008)
      run: sh scripts/check-coverage.sh coverage.out

  # The browser-level journey suite (#144): starts the app binary on a temp
  # SQLite database with the GitHub and LLM stubs, drives headless Chromium
  # through the participant journeys. Own Node dependencies in e2e/ so the
  # app itself stays zero-dependency (ADR-0009).
  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Set up Node
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: e2e/package-lock.json

    - name: Install the Playwright suite
      working-directory: e2e
      run: npm ci

    - name: Install Chromium
      working-directory: e2e
      run: npx playwright install --with-deps chromium

    - name: Run the E2E journeys
      working-directory: e2e
      run: npx playwright test
